name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # Same signing key every build, so updates install over the old app
      - name: Reuse signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: homesky-signing-key-v1
      - name: Generate Android project
        run: flutter create --platforms=android --org dev.homesky --project-name homesky .
      - name: Apply Homesky privacy settings and icon to Android
        run: python3 tool/patch_android.py
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: homesky-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows project
        run: flutter create --platforms=windows --org dev.homesky --project-name homesky .
      - name: Apply Homesky icon to Windows
        shell: pwsh
        run: Copy-Item assets/icon/app_icon.ico windows/runner/resources/app_icon.ico -Force
      - run: flutter pub get
      - name: Build Windows app
        run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: homesky-windows
          path: build/windows/x64/runner/Release/
